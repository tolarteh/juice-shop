# Paso 2 - SAST en modo informativo
# strict: false -> el escáner reporta los hallazgos pero no falla el pipeline.
# La salida es SARIF y se queda en el runner: no se exporta CSV ni se sube nada.
namespace: entrega4-juice-shop
language: ES
strict: false
output:
  file_path: fluidattacks-sast-results.sarif
  format: SARIF
sast:
  include:
    - .
  exclude:
    - node_modules
    - test
